    <meta name="theme-color" content="#FAFAF8" />
    <title>erre — vasos reutilizables en Monterrey</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('erre-theme')
          var dark =
            location.pathname !== '/qr' &&
            (pref === 'dark' ||
              (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#141413' : '#FAFAF8')
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Una red de vasos reutilizables que conecta cafeterías y personas en Monterrey." />
