<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />
    <title>erre — de mano en mano.</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('erre-theme')
          var dark =
            location.pathname !== '/qr' &&
            (pref === 'dark' ||
              (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#141413' : '#FAFAF8')
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Una red de vasos reutilizables que conecta cafeterías y personas en todo México." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
